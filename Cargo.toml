[workspace]
members = ["crates/*"]
resolver = "3"  # the resolver that comes with edition 2024

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hamiidreza/agent-credential-wallet"

[workspace.dependencies]
base64 = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
