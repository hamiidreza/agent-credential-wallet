[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hamiidreza/agent-credential-wallet"

[workspace.dependencies]
base64 = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
rmcp = { version = "3.5", features = ["transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net"] }
axum = "0.8"

argon2 = "0.6"
chacha20poly1305 = "0.11"
rpassword = "7.5"
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
